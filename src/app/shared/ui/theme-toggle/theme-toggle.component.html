<div class="theme-toggle" [class.with-menu]="showMenu()">
  <button class="toggle-btn" (click)="toggleTheme()" (contextmenu)="showMenuHandler(); $event.preventDefault()">
    <svg class="toggle-icon" [class.hidden]="!isDark()">
      <use href="#icon-moon"></use>
    </svg>
    <svg class="toggle-icon" [class.hidden]="isDark()">
      <use href="#icon-sun"></use>
    </svg>
  </button>

  @if (showMenu()) {
  <div class="theme-menu" (mouseleave)="hideMenu()">
    <ul class="theme-menu-list">
      @for (item of menuItems(); track item.value) {
      <li class="theme-menu-item" [class.active]="item.active">
        <button class="theme-menu-btn" (click)="selectTheme(item.value)">
          <svg class="theme-menu-icon">
            <path [attr.d]="getIconPath(item.icon)" />
          </svg>
          <span class="theme-menu-label">{{ item.label }}</span>
          @if (item.active) {
          <svg class="theme-menu-check">
            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
          </svg>
          }
        </button>
      </li>
      }
    </ul>
  </div>
  }
</div>
